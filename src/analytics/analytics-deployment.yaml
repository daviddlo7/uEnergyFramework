apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-deployment
  namespace: uenergyframework
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
      - name: analytics-container
        image: analytics:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 50051

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: uenergyframework
spec:
  type: ClusterIP
  selector:
    app: analytics
  ports:
  - port: 50051
    targetPort: 50051
