syntax = "proto3";

service Analytics {
    rpc CheckConnection (AnalyticsRequest) returns (AnalyticsResponse);
    rpc ProcessTestData (AnalyticsRequest) returns (AnalyticsResponse);
}

message AnalyticsRequest {
    string name = 1;
    string data = 2;
}

message AnalyticsResponse {
    string message = 1;
}