syntax = "proto3";

service Analytics {
    rpc CheckConnection (AnalyticsRequest) returns (AnalyticsResponse);
    rpc ProcessTestData (AnalyticsRequest) returns (AnalyticsResponse); // Nuevo método
}

message AnalyticsRequest {
    string name = 1;
    string data = 2; // Campo para enviar datos JSON como cadena
}

message AnalyticsResponse {
    string message = 1;
}