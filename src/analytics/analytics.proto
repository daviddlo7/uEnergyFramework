syntax = "proto3";

service AnalyticsService {
  rpc CheckConnection(CheckConnectionRequest) returns (AnalyticsResponse);
  rpc ProcessTestData(ProcessTestDataRequest) returns (AnalyticsResponse);
}

message AnalyticsResponse {
  string response = 1;
}

message CheckConnectionRequest {
  string id = 1;
}

message ProcessTestDataRequest {
  string device_name = 1;
  map<string, string> test_parameters = 2;
}

