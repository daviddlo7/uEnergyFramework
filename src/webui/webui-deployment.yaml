apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui-deployment
  namespace: uenergyframework
spec:
  replicas: 1  
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      containers:
      - name: nginx-container
        image: webui-nginx:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
      #- name: grpc-container
      #  image: webui-grpc:v1
      #  imagePullPolicy: Never
      #  ports:
      #  - containerPort: 50051
        volumeMounts:
              - name: nginx-config-volume
                mountPath: /etc/nginx/nginx.conf
                subPath: nginx.conf
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config


---
apiVersion: v1
kind: Service
metadata:
  name: webui-external-service
  namespace: uenergyframework
spec:
  type: LoadBalancer 
  selector:
    app: webui 
  ports:
  - protocol: TCP
    port: 8085
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: webui-service
  namespace: uenergyframework
spec:
  type: ClusterIP
  clusterIP: 10.152.183.11
  selector:
    app: webui
  ports:
  - name: grpc
    protocol: TCP
    port: 50051
    targetPort: 50051
 