apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui-deployment
spec:
  replicas: 1  
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      containers:
      - name: nginx-container
        image: webui-nginx:v1
        ports:
        - containerPort: 80
      - name: grpc-container
        image: webui-grpc:v1
        ports:
        - containerPort: 50051
        - containerPort: 50052
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: webui-nginx-service
spec:
  type: ClusterIP
  clusterIP: 10.152.183.20
  selector:
    app: webui
  ports:
  - name: nginx
    protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webui-grpc-service
spec:
  type: ClusterIP
  clusterIP: 10.152.183.11
  selector:
    app: webui
  ports:
  - name: flask-port
    protocol: TCP
    port: 50052       # Puerto para Flask
    targetPort: 50052 # Puerto donde escucha Flask dentro del contenedor
  - name: grpc-port
    protocol: TCP
    port: 50051       # Puerto para gRPC
    targetPort: 50051 # Puerto donde escucha gRPC dentro del contenedor
  - name: websocket-port
    protocol: TCP
    port: 5000
    targetPort: 5000
