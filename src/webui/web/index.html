<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebUI</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="grid-container">
    <!-- Top Left: Test Parameters -->
    <div class="grid-item top-left">
      <h3 class="section-title">Test</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="devices">Devices:</label>
          <select id="devices" multiple></select>
        </div>
      </div>

      <!-- Row: Traffic Config + Scenario -->
      <div class="form-row">
        <div class="form-group">
          <label for="traffic-config">Traffic Config:</label>
          <input list="traffic-config-options" id="traffic-config">
          <datalist id="traffic-config-options">
            <option value="IDLE">
            <option value="0%a100%(step10%-300seg)(noFW)">
            <option value="100%a0%(step10%-300seg)(noFW)">
            <option value="0%a100%a0%(step10%-300seg)(noFW)">
            <option value="0%a100%(step10%-300seg)(FW)">
            <option value="100%a0%(step10%-300seg)(FW)">
            <option value="0%a100%a0%(step10%-300seg)(FW)">
            <option value="0%a100%(step10%-300seg)(descarte)">
            <option value="100%a0%(step10%-300seg)(descarte)">
            <option value="0%a100%a0%(step10%-300seg)(descarte)">
            <option value="telemetry">
          </datalist>
        </div>
        <div class="form-group">
          <label for="scenario">Scenario:</label>
          <input list="scenario-options" id="scenario">
          <datalist id="scenario-options">
            <option value="idle">
            <option value="escenario1_1">
            <option value="escenario1_2">
            <option value="escenario2_1">
            <option value="escenario2_2">
            <option value="escenario3">
            <option value="escenario4_1">
            <option value="escenario4_2">
            <option value="escenario4_3">
            <option value="escenario5_1">
            <option value="escenario5_2">
            <option value="escenario6">
            <option value="escenario7">
            <option value="telemetry">
          </datalist>
        </div>
      </div>

      <!-- Row: Traffic Δ + Traffic -->
      <div class="form-row">
        <div class="form-group">
          <label for="traffic-change">Traffic Change:</label>
          <input type="text" id="traffic-change">
        </div>
        <div class="form-group">
          <label for="traffic">Traffic:</label>
          <input list="traffic-options" id="traffic">
          <datalist id="traffic-options">
            <option value="0">
            <option value="[0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200]">
            <option value="[200, 180, 160, 140, 120, 100, 80, 60, 40, 20, 0]">
            <option value="[0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200, 180, 160, 140, 120, 100, 80, 60, 40, 20, 0]">
            <option value="telemetry">
          </datalist>
        </div>
      </div>

      <!-- Row: Pkt Δ + Pkt Size -->
      <div class="form-row">
        <div class="form-group">
          <label for="package-change">Pkt Change:</label>
          <input type="text" id="package-change">
        </div>
        <div class="form-group">
          <label for="packet-size">Pkt Size:</label>
          <input list="packet-size-options" id="packet-size">
          <datalist id="packet-size-options">
            <option value="0">
            <option value="[64, 128, 256, 512, 1028]">
            <option value="telemetry">
          </datalist>
        </div>
      </div>

      <!-- Row: DB + DB Type -->
      <div class="form-row">
        <div class="form-group">
          <label for="database">Database:</label>
          <input list="database-options" id="database">
          <datalist id="database-options">
            <option value="pruebas">
            <option value="final">
          </datalist>
        </div>
        <div class="form-group">
          <label for="databasetype">DB Type:</label>
          <input list="databasetype-options" id="databasetype">
          <datalist id="databasetype-options">
            <option value="influxdb">
            <option value="sql">
          </datalist>
        </div>
      </div>

      <!-- Toggles -->
      <div class="form-row">
        <div class="form-group"><label><input type="checkbox" id="debug-mode"> Debug Mode</label></div>
        <div class="form-group"><label><input type="checkbox" id="log-mode"> Log Mode</label></div>
        <div class="form-group"><label><input type="checkbox" id="web-interface"> Web UI</label></div>
        <div class="form-group"><label><input type="checkbox" id="csv"> Save CSV</label></div>
      </div>

      <!-- Buttons -->
      <div class="form-row">
        <form id="startTestForm" class="form-group">
          <button id="myButton" type="submit">Run Test</button>
        </form>
        <form id="stopTestForm" class="form-group">
          <button type="submit">Stop Test</button>
        </form>
      </div>
    </div>

    <!-- Top Right -->
    <div class="grid-item top-right">
      <h3 class="section-title">Topology</h3>

      <!-- Controles: select, file y botón -->
      <div class="topology-controls" style="display: flex; align-items: center; gap: 12px;">
        <label for="topology-mode" style="margin: 0;">Mode:</label>
        <select id="topology-mode">
          <option value="" selected disabled hidden>Select mode</option>
          <option value="test">Test</option>
          <option value="topology">Topology</option>
          <option value="dynamic">Dynamic Topology</option>
          <option value="telemetry">Telemetry</option>
        </select>
        <input type="file" id="topology-file" accept=".json" />
        <button id="upload-topology">Upload</button>
      </div>

      <!-- Caja con topología y panel lateral -->
      <div id="topology-box" style="height: 500px; display: none; background: #fefefe; border: 1px solid #ccc; border-radius: 6px; margin-top: 10px;">
        <div id="topology" style="flex: 3; display: flex; flex-direction: column; padding: 0;">
          <div id="topology-graph" style="flex: 4; padding: 10px;"></div>
          <div id="topology-text" style="flex: 1; border-top: 1px solid #ccc; padding: 8px; font-size: 12px; overflow-y: auto;">
            <!-- info panel inferior -->
            <p style="color: gray; margin: 0;"></p>
          </div>
        </div>
        <div id="mode-panel" style="flex: 1; border-left: 1px solid #ccc; padding: 20px; display: none; overflow-y: auto;">
          <div id="panel-test" class="mode-panel-content" style="display: none; flex-direction: column; gap: 20px; height: 100%;">
            <fieldset style="border: 1px solid #ccc; padding: 10px;">
              <legend style="font-weight: bold;">Power Options</legend>
              <label><input type="checkbox" id="power-toggle"> Show Power Information</label>
            </fieldset>

            <fieldset style="border: 1px solid #ccc; padding: 10px;">
              <legend style="font-weight: bold;">Links</legend>
              <div style="font-size: 14px;">
                <a href="http://localhost:8087/grafana" target="_blank">Grafana</a><br>
                <a href="http://localhost:8087/database" target="_blank">Database</a>
              </div>
            </fieldset>
          </div>

          <div id="panel-topology" class="mode-panel-content" style="display: none; flex-direction: column; gap: 20px; height: 100%;">
            <!-- Power Options -->
            <fieldset style="border: 1px solid #ccc; padding: 10px;">
              <legend style="font-weight: bold;">Power Options</legend>
              <label>
                <input type="checkbox" id="show-power-toggle">
                Show Power Information
              </label>
            </fieldset>

            <!-- Path Calculation -->
            <fieldset style="border: 1px solid #ccc; padding: 10px;">
              <legend style="font-weight: bold;">Paths</legend>

              <label for="source-router">Source Router</label>
              <select id="source-router" style="width: 100%; margin-bottom: 10px;">
                <option value="">-- Select a router --</option>
              </select>

              <label for="destination-router">Destination Router</label>
              <select id="destination-router" style="width: 100%; margin-bottom: 10px;">
                <option value="">-- Select a router --</option>
              </select>

              <button onclick="calculatePathPowerConsumption()" style="width: 100%; margin-bottom: 10px;">Calculate Path</button>

              <label for="path-power-output">Power Consumption</label>
              <input type="text" id="path-power-output" readonly style="width: 100%;" />
            </fieldset>

            <!-- Topology Power Calculation -->
            <fieldset style="border: 1px solid #ccc; padding: 10px;">
              <legend style="font-weight: bold;">Topology</legend>
              <button onclick="calculateTopologyPowerConsumption()" style="width: 100%; margin-bottom: 10px;">Topology Power Consumption</button>
              <input type="text" id="topology-power-output" readonly style="width: 100%;" />
            </fieldset>
          </div>

          <div id="panel-telemetry" class="mode-panel-content" style="display: none;">
            <p style="color: gray;">[telemetry] panel placeholder</p>
          </div>

          <div id="panel-dynamic" class="mode-panel-content" style="display: none; flex-direction: column; justify-content: space-between; height: 100%;">
            <!-- 🔌 Power Options -->
            <fieldset>
              <legend style="font-weight: bold;">Power Options</legend>
              <label><input type="checkbox" id="dynamic-power-toggle"> Show Power Information</label>
            </fieldset>

            <!-- 🌗 Day/Night Toggle -->
            <fieldset>
              <legend style="font-weight: bold;">Day/Night</legend>
              <button style="width: 100%;">Switch Topology</button>
            </fieldset>

            <!-- ⚡ Topology Power -->
            <fieldset>
              <legend style="font-weight: bold;">Topology</legend>
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <button onclick="calculateTopologyPowerConsumption()" style="width: 100%;">Topology Power Consumption</button>
                <input type="text" id="topology-power-output" readonly style="width: 100%;" />
              </div>
            </fieldset>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Left: WebSocket -->
    <div class="grid-item bottom-left">
      <h3 class="section-title">Logs</h3>
      <ul id="response_test" class="scroll-box"></ul>
    </div>

    <!-- Bottom Right: Static data -->
    <div class="grid-item bottom-right">
      <h3 class="section-title">Static Data</h3>
        <div class="form-group">
            <label for="devices2">Device:</label>
            <select id="devices2">
            <option value="">-- Select a device --</option>
            </select>

            <div class="table-container">
            <table id="general-table">
                <thead>
                <tr><th>Name</th><th>Value</th></tr>
                </thead>
                <tbody></tbody>
            </table>

            <table id="components-table">
                <thead>
                <tr><th>Component</th><th>Typical Power</th><th>Nominal Power</th></tr>
                </thead>
                <tbody></tbody>
            </table>
            </div>
        </div>
        </div>
  </div>

  <p id="response"></p>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="./js/test.js"></script>
  <script src="./js/static.js"></script>
  <script src="./js/logs.js"></script>
  <script src="./js/topology.js"></script>
</body>
</html>
