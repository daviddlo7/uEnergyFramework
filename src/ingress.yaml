apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-ingress
  namespace: uenergyframework
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: webui.uenergyframework
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webui-nginx-service
            port:
              number: 80
  - host: database.uenergyframework
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: database-service
            port:
              number: 8086
  - host: grafana.uenergyframework
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
