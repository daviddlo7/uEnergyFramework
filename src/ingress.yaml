apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-ingress
  namespace: uenergyframework
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"  # Timeout para conexiones largas
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-set-header: "Upgrade $http_upgrade"  # Headers para WebSocket
    nginx.ingress.kubernetes.io/proxy-set-header: "Connection upgrade"
spec:
  ingressClassName: nginx
  rules:
  - host: webui.uenergyframework
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webui-nginx-service
            port:
              number: 80
      - path: /ws/
        pathType: Prefix
        backend:
          service:
            name: webui-grpc-service
            port:
              number: 5000
  - host: database.uenergyframework
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: database-service
            port:
              number: 8086
  - host: grafana.uenergyframework
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
