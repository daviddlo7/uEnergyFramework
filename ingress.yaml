apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uenergyframework-ingress
  namespace: uenergyframework
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: uenergyframework.local
    http:
      paths:
      - path: /grafana(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
      - path: /webui(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: webui-service
            port:
              number: 8085
      - path: /database(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: database-service
            port:
              number: 8086
